[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-sarvam"
version = "0.1.0.dev0"
description = "Community-maintained Sarvam AI services for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pipecat-sarvam contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pipecat-ai>=1.7.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/krrishcoder/pipecat-sarvam"
Issues = "https://github.com/krrishcoder/pipecat-sarvam/issues"
Repository = "https://github.com/krrishcoder/pipecat-sarvam"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_sarvam"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/ imports the diagnostic client from examples/, which is not an installed
# package. Put the repository root on sys.path so `examples.raw_realtime_stt`
# resolves as a namespace package during collection.
pythonpath = ["."]
markers = [
  "integration: opt-in tests that call the live Sarvam API",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
